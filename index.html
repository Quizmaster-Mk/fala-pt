/* V0.2 — pratique en dialogues guidés */
.practice-tabs{display:flex;gap:8px;margin:18px 0 22px;flex-wrap:wrap}

.practice-tabs button.on{background:#153f36;border-color:#153f36;color:#fff}
.conversation-summary{display:flex;align-items:center;justify-content:space-between;gap:16px}

.dialogue-body{min-width:0}
.dialogue-body h3{font-size:18px;margin:7px 0 7px;color:#1e3930}
.dialogue-body p{font-size:13px;line-height:1.45;color:#688072;margin:0 0 13px}
.dialogue-go{font-size:13px;font-weight:850;color:#187254}
.dialogue-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.transcript-btn{border:1px solid #b8d2c2;border-radius:99px;background:#fff;color:#1c684c;font-weight:800;padding:9px 12px;font-size:12px}
.speech-bubble{border:1px solid #dce9e0;background:linear-gradient(145deg,#eff7ed,#fff);padding:22px;border-radius:20px;margin:7px 0 25px}
.speaker{font-size:13px;font-weight:850;color:#25745a;margin-bottom:12px}
.speech-bubble .audio-btn{margin:0 0 13px}
.speech-text{font-size:24px;line-height:1.4;font-weight:800;color:#163e33;margin:7px 0}
.speech-translation{color:#668371;font-size:14px;margin-top:4px}
.speech-placeholder{font-size:13px;color:#7b9085;line-height:1.45;max-width:440px}
.reply-title{font-size:23px;font-weight:850;margin:12px 0 6px}
.reply-subtitle{font-size:15px;color:#678072;line-height:1.45;margin:0 0 19px}
.dialogue-tip{color:#587864;font-size:13px}
.dialogue-finish{text-align:center;padding:28px 24px}
.dialogue-finish h1{font-size:30px;margin:10px 0}
.dialogue-finish>p{color:#6b7d71;line-height:1.6}
.score-pill{display:inline-block;margin:13px auto;padding:9px 18px;border-radius:99px;background:#e9f6ed;color:#166a49;font-weight:850}
.dialogue-finish .footactions{justify-content:center}

function dialoguePlayer(){
  const total=scene.turns.length;
  if(sceneStep>=total)return `<div class="exercise"><div class="boxcard dialogue-finish"><div class="recap">🎉</div><h1>Muito bem!</h1><p>Tu as terminé « ${escapeHtml(scene.title)} ».</p><div class="score-pill">${sceneScore} bonne(s) réponse(s) sur ${total}</div><p class="muted">Tu peux refaire cette conversation pour gagner en aisance. Relis les corrections pour mémoriser les formulations utiles.</p><div class="footactions">${button('Refaire la conversation','scene-replay','btn secondary')}${button('Autres dialogues →','scene-exit')}</div></div></div>`;
  const turn=scene.turns[sceneStep];
  const choices=turn.choices.map((opt,i)=>`<button data-action="scene-choose:${i}" class="option ${sceneLocked&&i===turn.correct?'good':''} ${sceneLocked&&i===sceneChosen&&i!==turn.correct?'bad':''}" ${sceneLocked?'disabled':''} lang="pt-PT">${escapeHtml(opt)}</button>`).join('');
  const feedback=sceneLocked?`<div class="feedback ${sceneChosen===turn.correct?'':'error'}" role="status"><div class="fbtitle">${sceneChosen===turn.correct?'Muito bem !':'À retenir'}</div><strong lang="pt-PT">${escapeHtml(turn.choices[turn.correct])}</strong><p>${escapeHtml(turn.meaning)}</p><p class="dialogue-tip">💡 ${escapeHtml(turn.tip)}</p></div><div class="footactions">${button(sceneStep===total-1?'Terminer la conversation →':'Échange suivant →','scene-next')}</div>`:'';
  return `<div class="exercise dialogue-player"><div class="exhead"><button class="back" data-action="scene-exit" aria-label="Retour aux dialogues">←</button><div class="exhead-main"><div class="exhead-label">${escapeHtml(scene.title)} · Échange ${sceneStep+1} / ${total}</div><div class="progress-bar"><div style="width:${(sceneStep+1)/total*100}%"></div></div></div></div><div class="dialogue-top"><span class="smallcap">📖 LIS LA RÉPLIQUE</span><button class="transcript-btn" data-action="scene-transcript" aria-pressed="${showTranscript}">${showTranscript?'Masquer la traduction':'Voir la traduction'}</button></div><div class="speech-bubble"><div class="speaker">${escapeHtml(turn.role)} · ${escapeHtml(scene.location)}</div><div class="speech-text" lang="pt-PT">${escapeHtml(turn.line)}</div>${showTranscript?`<div class="speech-translation">${escapeHtml(turn.translation)}</div>`:'<div class="speech-placeholder">Essaie d’abord de comprendre la phrase en portugais, puis consulte la traduction si besoin.</div>'}</div><div class="reply-title">À toi de répondre !</div><p class="reply-subtitle">${escapeHtml(turn.question)}</p><div class="options">${choices}</div>${feedback}<div class="note">Lis les corrections en portugais et en français pour consolider les formulations.</div></div>`;
}
function startScene(id){
  scene=dialogues.find(d=>d.id===id);
  if(!scene)return;
  sceneStep=0;sceneScore=0;sceneChosen=-1;sceneLocked=false;showTranscript=false;
  active=null;page='practice';render();window.scrollTo(0,0);
}
function nextScene(){
  if(!scene||!sceneLocked)return;
  if(sceneStep===scene.turns.length-1){
    const prev=state.dialogues[scene.id];
    state.dialogues[scene.id]={completed:Date.now(),best:Math.max(sceneScore,prev?.best||0),plays:(prev?.plays||0)+1};
    if(!prev)award(30);
    save();
  }
  sceneStep++;sceneChosen=-1;sceneLocked=false;
  render();window.scrollTo(0,0);
}
function review(){const difficult = Object.entries(state.mistakes).sort((a,b)=>b[1].count-a[1].count).map(([text,v])=>[text,v.meaning]);const deck=[...difficult,...phrases.filter(([p])=>!state.mistakes[p])];if(reviewIndex>=deck.length)reviewIndex=0;const card=deck[reviewIndex];return `<div class="subhero"><span class="eyebrow">MÉMORISER</span><h1>Réviser intelligemment</h1><p>${difficult.length?`${difficult.length} expression(s) à retravailler en priorité.`:'Commence par ces phrases utiles. Tes erreurs remonteront en haut de la liste.'}</p></div><div class="boxcard flashcard"><div class="smallcap">CARTE ${reviewIndex+1} / ${deck.length}</div><div class="port" lang="pt-PT">${escapeHtml(card[0])}</div>${showAnswer?`<div class="trans">${escapeHtml(card[1])}</div>`:`<div class="muted">À ton avis, que signifie cette phrase ?</div>`}<div class="review-actions">${button(showAnswer?'Carte suivante →':'Voir la traduction','flip')}</div></div><div class="note">V1 : les erreurs passent en priorité. Un véritable calendrier de répétition espacée est prévu pour la version suivante.</div>`;}
function profile(){return `<div class="subhero"><span class="eyebrow">TON PROFIL</span><h1>À ton rythme</h1><p>Pour cette première version, tes résultats sont enregistrés uniquement dans ce navigateur, sur cet appareil.</p></div>${stats()}<div class="boxcard"><h2 style="margin:0 0 9px;font-size:20px">Ton apprentissage</h2><div class="switchrow"><div><strong>📖 Comprendre à l’écrit</strong><div class="muted" style="font-size:12px;margin-top:5px">Phrases du quotidien, questions et traductions.</div></div><span>✓ Actif</span></div><div class="switchrow"><div><strong>✍️ S’exprimer à l’écrit</strong><div class="muted" style="font-size:12px;margin-top:5px">Reconstituer et rédiger des réponses simples.</div></div><span>✓ Actif</span></div><div class="note">Les fonctionnalités vocales sont volontairement reportées. Tu peux apprendre et réviser sans le son.</div></div><div class="boxcard"><strong>Sauvegarde et confidentialité</strong><p class="muted" style="font-size:13px;line-height:1.5">Aucun compte, aucune donnée envoyée à un serveur. Effacer les données de ce site supprimera ta progression.</p>${button('Réinitialiser ma progression','reset','btn ghost')}</div>`;}
function currentTask(){return active?.exercises[step];}
function exercise(){const ex=currentTask(), l=active;const typeLabel={listen:'Lecture et compréhension',reply:'Choisir la bonne réponse',arrange:'Construire une phrase',speak:'Écrire en portugais'}[ex.kind];let body='';if(ex.kind==='listen')body=`<div class="written-prompt"><span class="smallcap">PHRASE À LIRE · PT-PT</span><strong lang="pt-PT">${escapeHtml(ex.text)}</strong></div>`;if(ex.kind==='listen'||ex.kind==='reply')body+=`<div class="options">${ex.options.map((o,i)=>`<button data-action="choose:${i}" class="option ${selectedIndex===i?'selected':''} ${locked&&o===ex.answer?'good':''} ${locked&&selectedIndex===i&&o!==ex.answer?'bad':''}" ${locked?'disabled':''}>${escapeHtml(o)}</button>`).join('')}</div>`;if(ex.kind==='arrange')body+=`<div class="smallcap">TA PHRASE</div><div class="answerline">${order.map((id,i)=>`<button class="word" data-action="remove:${i}">${escapeHtml(ex.words[id])}</button>`).join('')}</div><div class="smallcap">TOUCHE LES MOTS DANS L’ORDRE</div><div class="wordbank">${ex.words.map((w,i)=>`<button class="word" data-action="word:${i}" ${order.includes(i)?'disabled':''}>${escapeHtml(w)}</button>`).join('')}</div>`;if(ex.kind==='speak')body+=`<div class="written-prompt"><span class="smallcap">TRADUIS EN PORTUGAIS</span><strong>${escapeHtml(ex.meaning)}</strong></div><label class="written-label" for="lesson-written">Ta réponse en portugais</label><input class="write-input" id="lesson-written" type="text" lang="pt-PT" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Écris ta traduction..." value="${escapeHtml(writtenAnswer)}" ${locked?'disabled':''}><div class="note">Écris une phrase complète. Les accents et la ponctuation sont expliqués dans la correction.</div>`;if(!locked&&ex.kind==='speak')body+=`<div class="footactions">${button('Voir la solution','text-reveal','btn secondary')}${button('Vérifier ma réponse','text-check')}</div>`;let controls='';if(!locked&&ex.kind==='arrange')controls=`<div class="footactions">${button('Effacer','clear','btn secondary')}${button('Vérifier la phrase','check')}</div>`;if(locked)controls=`<div class="feedback ${selected===false?'error':''}"><div class="fbtitle">${selected===false?'À revoir':'Très bien !'}</div>${escapeHtml(ex.meaning||'Tu as terminé cette étape.')} ${ex.kind==='speak'?`<div style="margin-top:6px">Formulation attendue : <strong lang="pt-PT">${escapeHtml(ex.text)}</strong></div>`:selected===false?`<div style="margin-top:6px">Bonne réponse : <strong>${escapeHtml(ex.answer||ex.text)}</strong></div>`:''}</div><div class="footactions">${button(step===l.exercises.length-1?'Terminer la leçon →':'Continuer →','next')}</div>`;const q=ex.kind==='speak'?'Écris cette phrase en portugais':ex.kind==='listen'?'Lis et choisis le bon sens':ex.prompt;return `<div class="exercise"><div class="exhead"><button class="back" data-action="nav:learn" aria-label="Retour aux leçons">←</button><div class="exhead-main"><div class="exhead-label">${escapeHtml(l.title)} · Étape ${step+1} / ${l.exercises.length}</div><div class="progress-bar"><div style="width:${(step+1)/l.exercises.length*100}%"></div></div></div></div><div class="smallcap">${typeLabel}</div><h1 class="question">${escapeHtml(q)}</h1>${body}${controls}</div>`;}
function finished(){const l=active;return `<div class="exercise"><div class="boxcard" style="text-align:center;padding:31px 20px"><div class="recap">🎉</div><h1 class="question">Muito bem!</h1><p class="muted">Tu as terminé « ${escapeHtml(l.title)} ». Un petit pas de plus vers des conversations naturelles !</p><div class="stat-grid"><div class="stat"><div class="slabel">Leçon</div><div class="svalue">✓</div></div><div class="stat"><div class="slabel">Exercices</div><div class="svalue">${l.exercises.length}</div></div><div class="stat"><div class="slabel">Progression</div><div class="svalue">${percent()}%</div></div></div>${button('Retour aux leçons','nav:learn','btn wide')}</div></div>`;}
function render(){app.innerHTML=shell(active?(step>=active.exercises.length?finished():exercise()):page==='home'?home():page==='learn'?learn():page==='practice'?practice():page==='review'?review():profile());document.title=`Fala PT — ${active?active.title:menus.find(m=>m[0]===page)?.[2]}`;}
function start(id){active=lessons.find(l=>l.id===id);if(!active)return;step=0;resetExercise();render();window.scrollTo(0,0);}
function resetExercise(){selected=null;selectedIndex=-1;order=[];attempts=0;locked=false;writtenAnswer='';}
function mistake(ex){const text=ex.text||ex.answer;const val=state.mistakes[text]||{count:0,meaning:ex.meaning||''};val.count++;state.mistakes[text]=val;save();}
function award(n=10){state.xp+=n;save();}
function verify(correct){if(locked)return;locked=true;selected=correct?true:false;if(correct)award(attempts?5:10);else mistake(currentTask());render();}
function normalizedWritten(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-PT').replace(/[.,!?;:¿¡]/g,'').replace(/\s+/g,' ').trim();}
function completedLesson(){if(!state.completed[active.id]){state.completed[active.id]=Date.now();const key=dateKey();state.days[key]=(state.days[key]||0)+1;award(20);}save();step=active.exercises.length;render();}
app.addEventListener('click', e=>{const audio=e.target.closest('[data-say]');if(audio)return;const btn=e.target.closest('[data-action]');if(!btn)return;const [action,payload]=btn.dataset.action.split(':');if(action==='nav'){active=null;scene=null;page=payload;render();window.scrollTo(0,0);return;}if(action==='start'){start(payload);return;}if(action==='flip'){if(showAnswer){reviewIndex++;showAnswer=false;}else showAnswer=true;render();return;}if(action==='practice-mode'){practiceMode=payload;scene=null;render();return;}
  if(action==='scene-start'){startScene(payload);return;}
  if(action==='scene-exit'){scene=null;page='practice';render();window.scrollTo(0,0);return;}
  if(action==='scene-replay'){startScene(scene.id);return;}
  if(action==='scene-transcript'){if(scene){showTranscript=!showTranscript;render();}return;}
  if(action==='scene-choose'){if(!scene||sceneLocked)return;const turn=scene.turns[sceneStep];const n=Number(payload);if(!Number.isInteger(n)||n<0||n>=turn.choices.length)return;sceneChosen=n;sceneLocked=true;if(n===turn.correct){sceneScore++;}else mistake({text:turn.choices[turn.correct],meaning:turn.meaning});render();return;}
  if(action==='scene-next'){nextScene();return;}
  if(action==='reset'){if(confirm('Effacer la progression enregistrée sur cet appareil ?')){state=structuredClone(DEFAULT);save();render();}return;}if(!active)return;const ex=currentTask();if(action==='choose'){if(locked)return;const idx=Number(payload);if(idx!==selected&&selected!==null&&typeof selected==='number')attempts++;selected=idx;selectedIndex=idx;const isCorrect=ex.options[idx]===ex.answer;verify(isCorrect);return;}if(action==='word'){if(!order.includes(Number(payload))&&!locked){order.push(Number(payload));render();}return;}if(action==='remove'){if(!locked){order.splice(Number(payload),1);render();}return;}if(action==='clear'){order=[];render();return;}if(action==='check'){if(!order.length){toast('Choisis d’abord quelques mots.');return;}const answer=order.map(i=>ex.words[i]).join(' ').replace(/\s+([.,!?])/g,'$1');verify(answer===ex.answer);return;}if(action==='text-check'){if(locked||ex.kind!=='speak')return;const value=writtenAnswer.trim();if(!value){toast('Écris ta réponse avant de vérifier.');return;}verify(normalizedWritten(value)===normalizedWritten(ex.text));return;}if(action==='text-reveal'){if(locked||ex.kind!=='speak')return;verify(false);return;}if(action==='next'){if(step===active.exercises.length-1){completedLesson();return;}step++;resetExercise();render();window.scrollTo(0,0);return;}});
app.addEventListener('input',e=>{if(e.target.id==='lesson-written')writtenAnswer=e.target.value;});
render();
</script></body></html>
